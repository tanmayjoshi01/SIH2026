version: "3.9"
 
services:
  postgres:
    image: postgres:16-alpine
    container_name: sih2026_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih2026
      POSTGRES_PASSWORD: sih2026pass
      POSTGRES_DB: sih2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
 
  prometheus:
    image: prom/prometheus:latest
    container_name: sih2026_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
 
  grafana:
    image: grafana/grafana:latest
    container_name: sih2026_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
 
volumes:
  postgres_data:
  prometheus_data:
  grafana_data: